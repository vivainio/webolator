[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "webolator"
description = "Zero-config markdown to website: folder or single file, mermaid, syntax highlighting, single-file HTML output"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ville Vainio", email = "vivainio@gmail.com" }]
keywords = ["markdown", "static-site", "mermaid", "documentation", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/vivainio/webolator"
Repository = "https://github.com/vivainio/webolator"

[tool.maturin]
bindings = "bin"
